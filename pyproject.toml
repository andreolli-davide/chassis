[project]
name = "chassis-harness"
version = "0.8.0"
description = "Chassis: transactional runtime composition for dynamic agent systems -- scoped ownership, reactive capabilities, and immutable runtime generations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chassis contributors" }]
keywords = ["agents", "runtime", "composition", "langgraph", "lifecycle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=26.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The LangGraph adapter and the langchain-core tools it compiles into graphs.
langgraph = [
    "langchain-core>=1.6.3",
    "langgraph>=1.2.11",
]
# The LangSmith telemetry backend and evaluation helper.
langsmith = [
    "langsmith>=0.12.5",
]

[project.urls]
Homepage = "https://github.com/andreolli-davide/chassis"
Repository = "https://github.com/andreolli-davide/chassis"
Issues = "https://github.com/andreolli-davide/chassis/issues"
Changelog = "https://github.com/andreolli-davide/chassis/blob/main/CHANGELOG.md"
Documentation = "https://github.com/andreolli-davide/chassis/tree/main/docs"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "langchain-core>=1.6.3",
    "langgraph>=1.2.11",
    "langsmith>=0.12.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chassis"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # langsmith's evaluation module reads the deprecated `ast.Str` alias at import
    # time. That is upstream code executed by the interpreter, not behaviour under
    # test, and ignoring it narrowly keeps every other warning fatal.
    "ignore:ast.Str is deprecated:DeprecationWarning",
]
addopts = "-ra --strict-markers --strict-config"
# Allow tests to share helpers through `tests.*` modules.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]
# Documentation embeds illustrative, deliberately elided snippets; they are not
# part of the build and must not be reformatted by the Markdown formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "ASYNC",
    "TID",
]
ignore = [
    "B008", # function call in default argument (needed for typer-style defaults)
]

[tool.ruff.lint.isort]
known-first-party = ["chassis"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T201"]
"tests/**" = ["T201"]

[tool.coverage.run]
source = ["src/chassis"]
branch = true

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
