name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The lockfile job: the reproducible development baseline. Every other
  # dependency job compares against it.
  checks:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync environment from the lockfile
        run: uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  coverage:
    name: branch coverage and focused floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment from the lockfile
        run: uv sync --locked --all-extras --dev

      - name: Measure branch coverage
        run: uv run pytest --cov=src/chassis --cov-branch --cov-report=term

      - name: Enforce global and focused coverage floors
        run: uv run python scripts/coverage_gate.py

  minimum-dependencies:
    name: minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Resolve the lowest direct-dependency versions
        run: uv lock --resolution lowest-direct

      - name: Sync and test at the minimum
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run pytest

  latest-dependencies:
    name: latest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Resolve the latest compatible versions
        run: uv lock --upgrade

      - name: Sync and test at the latest
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run pytest

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build
        run: uv build

      # The wheel must work on its own, in an environment that has never seen the
      # source tree: the core imports without the optional integrations, then the
      # LangGraph extra installs and a real agent runs.
      - name: Install the core wheel into a clean environment
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python dist/*.whl

      - name: The core imports without the optional integrations
        run: |
          .smoke/bin/python - <<'PY'
          import sys

          import chassis
          import chassis.replay
          import chassis.telemetry
          import chassis.testing
          import chassis.tools

          assert chassis.__version__ != "0.0.0", "version did not resolve from the distribution"
          loaded = sorted(
              name
              for name in sys.modules
              if name.split(".")[0] in {"langgraph", "langchain_core", "langsmith"}
          )
          assert loaded == [], f"the core imported optional integrations: {loaded}"
          print("core chassis", chassis.__version__, "imports without the extras")
          PY

      - name: Install the LangGraph extra
        run: |
          wheel=$(ls dist/*.whl)
          uv pip install --python .smoke/bin/python "${wheel}[langgraph]"

      - name: Import the installed integrations
        run: |
          .smoke/bin/python - <<'PY'
          import chassis.langgraph
          import chassis.testing

          print("the langgraph extra provides the adapter and the test doubles")
          PY

      - name: Run the quickstart against the installed package
        run: .smoke/bin/python examples/quickstart.py

      - name: Run the production reference application against the installed package
        run: .smoke/bin/python -m examples.production_reference.app

      - name: Install and import the sdist in a clean environment
        run: |
          uv venv .smoke-sdist
          uv pip install --python .smoke-sdist/bin/python dist/*.tar.gz
          .smoke-sdist/bin/python -c "import chassis, chassis.replay; print('sdist chassis', chassis.__version__)"

      - name: Smoke the LangSmith extra independently
        run: |
          wheel=$(ls dist/*.whl)
          uv venv .smoke-ls
          uv pip install --python .smoke-ls/bin/python "${wheel}[langsmith]"
          .smoke-ls/bin/python -c "import chassis.testing, langsmith; print('langsmith extra ok')"

      - name: Smoke the OpenTelemetry extra independently
        run: |
          wheel=$(ls dist/*.whl)
          uv venv .smoke-otel
          uv pip install --python .smoke-otel/bin/python "${wheel}[opentelemetry]"
          .smoke-otel/bin/python - <<'PY'
          import opentelemetry
          from chassis.telemetry import OpenTelemetryTelemetry

          OpenTelemetryTelemetry()
          print("opentelemetry extra ok")
          PY

      - name: Smoke the combined extras independently
        run: |
          wheel=$(ls dist/*.whl)
          uv venv .smoke-all
          uv pip install --python .smoke-all/bin/python "${wheel}[langgraph,langsmith,opentelemetry]"
          .smoke-all/bin/python - <<'PY'
          import chassis.langgraph
          import langsmith
          from chassis.telemetry import OpenTelemetryTelemetry

          OpenTelemetryTelemetry()
          print("combined extras ok")
          PY

  audit:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment from the lockfile
        run: uv sync --locked --all-extras --dev

      # Triage process (see docs/security.md): every finding is fixed, pinned
      # with a reviewed upper bound, or ignored here with a written rationale.
      # An untriaged finding fails the job.
      - name: Audit installed dependencies
        run: uv run --with pip-audit pip-audit
