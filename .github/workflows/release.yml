name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Read the project version
        id: version
        run: |
          version=$(uv run --no-project python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          prerelease=$(uv run --no-project --with packaging python -c "from packaging.version import Version; import sys; print(str(Version(sys.argv[1]).is_prerelease).lower())" "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "project version: $version"
          echo "prerelease: $prerelease"

      # Publishing is irreversible, so the tag, the project version, and the
      # changelog must agree before the full release matrix starts.
      - name: The tag must match the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "tag and project version agree: $tag"

      - name: The changelog must document this version
        run: |
          key="## [${{ steps.version.outputs.version }}]"
          if ! grep -qF "$key" CHANGELOG.md; then
            echo "CHANGELOG.md has no '$key' section" >&2
            exit 1
          fi
          echo "changelog documents ${{ steps.version.outputs.version }}"

  quality:
    name: run the complete CI and package matrix
    needs: prepare
    uses: ./.github/workflows/ci.yml

  bundle:
    name: assemble the verified release bundle
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    steps:
      # The reusable CI workflow builds once and verifies wheel, sdist, every
      # optional extra, the quickstart, and the production reference app. The
      # release promotes those exact bytes instead of rebuilding them.
      - name: Download the verified distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-distributions
          path: dist

      - name: Verify artifact names and record their digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/chassis_harness-${VERSION}-py3-none-any.whl"
          test -f "dist/chassis_harness-${VERSION}.tar.gz"
          (cd dist && sha256sum -- * | sort -k 2) > SHA256SUMS

      # The SBOM must live outside dist/: pypa/gh-action-pypi-publish publishes
      # every file in the packages directory and rejects non-distributions.
      - name: Generate an SBOM for the distribution
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Every publishing job downloads this one immutable workflow artifact.
      # PyPI receives dist/; GitHub receives the same files plus digests and SBOM.
      - name: Upload the release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/
            sbom.cdx.json
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [prepare, bundle]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chassis-harness
    permissions:
      contents: read
      # Trusted publishing: PyPI verifies this workflow's identity, so no API
      # token is stored anywhere.
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: .

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: publish the GitHub Release
    needs: [prepare, bundle, publish]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the verified distribution
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: .

      - name: Build release notes from the changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            printf '%s\n' "\`\`\`bash" "pip install chassis-harness==$VERSION" "\`\`\`" ""
            printf -- '- Documentation: https://andreolli-davide.github.io/chassis/\n'
            printf -- '- PyPI: https://pypi.org/project/chassis-harness/%s/\n\n' "$VERSION"
            # The dollar expression belongs to awk, not the shell.
            # shellcheck disable=SC2016
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { publishing = 1; next }
              publishing && /^## \[/ { exit }
              publishing { print }
            ' CHANGELOG.md
          } > release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release and attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_flags=(--latest)
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            release_flags=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            sbom.cdx.json \
            SHA256SUMS \
            --verify-tag \
            "${release_flags[@]}" \
            --title "chassis-harness $VERSION" \
            --notes-file release-notes.md

  docs:
    name: publish the released documentation
    needs: [prepare, github-release]
    # Prereleases remain available from their immutable GitHub/PyPI artifacts,
    # but must not replace the documentation for the latest stable release.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && needs.prepare.outputs.prerelease != 'true'
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
    permissions:
      contents: read
      pages: write
      id-token: write
