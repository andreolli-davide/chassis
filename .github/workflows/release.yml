name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment from the lockfile
        run: uv sync --locked --all-extras --dev

      - name: Lint, type-check, and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest

      - name: Read the project version
        id: version
        run: |
          version=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      # Publishing is irreversible, so the tag, the project version, and the
      # changelog must agree before anything is built.
      - name: The tag must match the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "tag and project version agree: $tag"

      - name: The changelog must document this version
        run: |
          key="## [${{ steps.version.outputs.version }}]"
          if ! grep -qF "$key" CHANGELOG.md; then
            echo "CHANGELOG.md has no '$key' section" >&2
            exit 1
          fi
          echo "changelog documents ${{ steps.version.outputs.version }}"

      - name: Build
        run: uv build

      # The artifact, not the source tree: install the core wheel into an
      # environment that has never seen this checkout, prove it works without the
      # optional integrations, then add the LangGraph extra and run a real agent.
      - name: Verify the built wheel
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python - <<'PY'
          import sys

          import chassis
          import chassis.replay
          import chassis.telemetry
          import chassis.testing

          expected = "${{ steps.version.outputs.version }}"
          assert chassis.__version__ == expected, f"{chassis.__version__} != {expected}"
          loaded = sorted(
              name
              for name in sys.modules
              if name.split(".")[0] in {"langgraph", "langchain_core", "langsmith"}
          )
          assert loaded == [], f"the core imported optional integrations: {loaded}"
          print("installed chassis-harness", chassis.__version__, "without the extras")
          PY
          wheel=$(ls dist/*.whl)
          uv pip install --python .smoke/bin/python "${wheel}[langgraph]"
          .smoke/bin/python examples/quickstart.py

      # The SBOM must live outside dist/: pypa/gh-action-pypi-publish publishes
      # every file in the packages directory and rejects non-distributions.
      - name: Generate an SBOM for the distribution
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Publishing through pypa/gh-action-pypi-publish attests the artifacts
      # (Trusted Publishing + digital attestations), so provenance ships with
      # the release; the SBOM ships alongside the uploaded distributions.
      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chassis-harness
    permissions:
      contents: read
      # Trusted publishing: PyPI verifies this workflow's identity, so no API
      # token is stored anywhere.
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: publish the GitHub Release
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the verified distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .

      - name: Build release notes from the changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            printf '```bash\npip install chassis-harness==%s\n```\n\n' "$VERSION"
            printf -- '- Documentation: https://andreolli-davide.github.io/chassis/\n'
            printf -- '- PyPI: https://pypi.org/project/chassis-harness/%s/\n\n' "$VERSION"
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { publishing = 1; next }
              publishing && /^## \[/ { exit }
              publishing { print }
            ' CHANGELOG.md
          } > release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release and attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            sbom.cdx.json \
            --verify-tag \
            --latest \
            --title "chassis-harness $VERSION" \
            --notes-file release-notes.md

  docs:
    name: publish the released documentation
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
    permissions:
      contents: read
      pages: write
      id-token: write
