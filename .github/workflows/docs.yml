name: Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the built site"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Strict mode fails on a broken link or an unknown target, so the site cannot
      # be published with dead ends in it. tests/test_docs_links.py covers the same
      # ground against the source tree, where links out of docs/ are real files.
      - name: Build (strict)
        run: |
          uv sync --locked --no-dev --group docs
          uv run mkdocs build --strict

      - name: Configure Pages
        if: inputs.deploy == true
        uses: actions/configure-pages@v6

      - name: Upload the site
        if: inputs.deploy == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # Main and pull requests verify the development documentation but never
    # replace the stable site. Only a stable release calls this workflow with
    # deploy=true.
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
