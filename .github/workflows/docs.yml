name: Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the built site"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the current documentation and the 0.9.1 archive"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Strict mode fails on a broken link or an unknown target, so the site cannot
      # be published with dead ends in it. tests/test_docs_links.py covers the same
      # ground against the source tree, where links out of docs/ are real files.
      - name: Build (strict)
        run: |
          uv sync --locked --no-dev --group docs
          uv run mkdocs build --strict

      - name: Check out the 0.9.1 documentation
        if: inputs.deploy == true
        uses: actions/checkout@v7
        with:
          ref: v0.9.1
          path: .stable-docs-source

      - name: Build the immutable 0.9.1 archive
        if: inputs.deploy == true
        run: |
          sed \
            -e 's#site_url: https://andreolli-davide.github.io/chassis/#site_url: https://andreolli-davide.github.io/chassis/0.9.1/#' \
            -e 's#edit_uri: edit/main/docs/#edit_uri: blob/v0.9.1/docs/#' \
            .stable-docs-source/mkdocs.yml > .stable-docs-source/mkdocs.archive.yml
          uv run mkdocs build --strict \
            -f .stable-docs-source/mkdocs.archive.yml \
            --site-dir "$GITHUB_WORKSPACE/site/0.9.1"

      - name: Configure Pages
        if: inputs.deploy == true && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/configure-pages@v6

      - name: Upload the site
        if: inputs.deploy == true && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # A manual main run can publish beta docs with the stable archive. Stable
    # release tags can still publish through the release workflow. Pushes and
    # pull requests only verify the documentation.
    if: inputs.deploy == true && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
